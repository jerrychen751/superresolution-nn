defaults:
  - download: default
  - preprocess: default
  - train: default
  # model_params group auto-selects based on the 'model' key below.
  # e.g. model=closure_cnn loads model_params/closure_cnn.yaml
  - model_params: ${model}
  # _self_ controls where this file's own keys (below) sit in the merge order.
  # Placing it last means our top-level keys take priority over group defaults on conflict.
  - _self_

model: superresolution_cnn
raw_data_dir: null
processed_data_dir: null
checkpoints_dir: null
weights_dir: null
outputs_dir: null
