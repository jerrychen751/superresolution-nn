defaults:
  - _self_

download:
  jhtdb_dataset: isotropic1024coarse
  jhtdb_cache_dir: ${storage_root}/jhtdb_cache
  nx: 128
  ny: 128
  nz: 128
  num_cubes: 700
  max_timesteps: 5024
  jhtdb_token: edu.gatech.jerrychen-6b7455a7

preprocess:
  sigma: 1.0
  downsample_step: 4
  spline_interpolation_order: 3

train:
  epochs: 1000
  train_ratio: 0.8
  learning_rate: 0.001
  eta_min: 1.0e-6
  batch_size: 4
  num_workers: 4

# All artifact paths derive from storage_root, which is set by the env config group (env/local.yaml or env/hpc.yaml).
raw_data_dir: ${storage_root}/data/raw
processed_data_dir: ${storage_root}/data/processed/${model.name}
checkpoints_dir: ${storage_root}/checkpoints/${model.name}
weights_dir: ${storage_root}/weights/${model.name}
outputs_dir: ${storage_root}/outputs/${model.name}
logs_dir: ${storage_root}/logs/${model.name}
