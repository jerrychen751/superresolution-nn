[project]
name = "pi-cnn"
version = "0.1.0"
description = "Physics-informed CNN for turbulence super-resolution"
requires-python = ">=3.11"

# Core: required by superresolution/ pipeline
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "givernylocal",
    "torch",
    "torchvision",
    "torchaudio",
    # PyG for the gnn model variant.
    # We only use GCNConv and Data, which are pure-Python in modern PyG, so no torch-scatter wheels needed.
    "torch-geometric>=2.4",
]

[dependency-groups]
extras = [
    # Useful for exploratory work and notebooks
    "pandas",
    "h5py",
    "netCDF4",
    "xarray",
    "scikit-learn",
    "scikit-image",
    "jupyterlab",
    "tensorboard",
    "tqdm",
    "pyyaml",
    "seaborn",
    "opencv-python-headless",
    # ML ecosystem extras (wandb for experiment tracking, einops for tensor reshaping, etc.)
    "pytorch-lightning",
    "accelerate",
    "wandb",
    "torchmetrics",
    "einops",
]

[tool.uv]
package = false

# PyTorch with CUDA 12.6 on Linux (PACE). Every other platform takes the default PyPI wheels, which are CPU-only.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
